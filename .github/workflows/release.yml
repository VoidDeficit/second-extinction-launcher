name: Release

# Builds se-launcher for Linux and Windows and publishes both binaries as a
# GitHub release. Runs on v* tags, or manually with an existing tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Bookworm keeps the Linux binary at glibc 2.36 instead of the runner's 2.39,
    # and matches the OneDev build image.
    container: rust:1.98-bookworm
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            bin: se-launcher
            asset: se-launcher-linux-x86_64
            packages: >-
              libxkbcommon-dev libwayland-dev libx11-dev libxi-dev
              libxcursor-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev
          - target: x86_64-pc-windows-gnu
            bin: se-launcher.exe
            asset: se-launcher-windows-x86_64.exe
            packages: gcc-mingw-w64-x86-64
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq ${{ matrix.packages }} >/dev/null

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Add desktop entry and checksums
        run: |
          chmod +x dist/se-launcher-linux-x86_64
          cp se-launcher.desktop dist/
          cd dist && sha256sum * > SHA256SUMS.txt

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          cat > notes.md <<'EOF'
          Linux and Windows builds of the launcher.

          | Asset | Platform |
          | --- | --- |
          | `se-launcher-linux-x86_64` | Linux x86_64 (glibc 2.36+) |
          | `se-launcher-windows-x86_64.exe` | Windows x86_64 |
          | `se-launcher.desktop` | desktop entry for Linux |

          `SHA256SUMS.txt` has the checksums. See the README for setup and usage.

          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Second Extinction launcher $TAG" \
              --notes-file notes.md
          fi
